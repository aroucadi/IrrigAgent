name: Continuous Deployment (GCP Cloud Run & Terraform IaC)

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
  IMAGE_NAME: irrigagent

jobs:
  deploy:
    name: Build, Push Container & Apply Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Container Registry
        run: |
          gcloud auth configure-docker --quiet

      - name: Build & Tag Container Image
        run: |
          IMAGE_URI="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_URI="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "${IMAGE_URI}" -t "${LATEST_URI}" .

      - name: Push Container Image to Registry
        run: |
          IMAGE_URI="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_URI="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"

      - name: Set up HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        run: |
          terraform -chdir=infra init

      - name: Terraform Apply
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_container_image: "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          TF_VAR_whatsapp_access_token: ${{ secrets.WHATSAPP_TOKEN }}
          TF_VAR_whatsapp_verify_token: ${{ secrets.VERIFY_TOKEN }}
          TF_VAR_cron_secret: ${{ secrets.CRON_SECRET }}
        run: |
          terraform -chdir=infra apply -auto-approve
